<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Système Silhouette — Entraînement</title>
<meta name="description" content="Entraîne-toi à mémoriser des chiffres avec le Système Silhouette : une consonne par chiffre, choisie par ressemblance de forme.">
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0f0f14; --panel:#17171f; --pink:#ff4fa3; --pink-dim:#ff4fa355;
    --text:#f2f2f5; --muted:#9797a3; --green:#37d67a; --red:#ff5470; --gold:#ffcc4d;
  }
  *{box-sizing:border-box}
  html{width:100%; overflow-x:hidden}
  body{
    margin:0; min-height:100vh; width:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:24px 16px 48px;
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  h1{font-size:1.3rem; margin:8px 0 2px; text-align:center}
  .sub{color:var(--pink); font-size:.85rem; margin-bottom:20px; text-align:center}
  .panel{
    background:var(--panel); border-radius:18px; padding:20px;
    width:100%; max-width:420px; margin-bottom:16px;
  }
  .legend-wrap{width:100%; max-width:100%; overflow-x:auto}
  table.legend{width:100%; border-collapse:collapse; font-size:.95rem; table-layout:fixed}
  table.legend td{padding:8px 2px; text-align:center; border-bottom:1px solid #26262f}
  table.legend tr:first-child td{color:var(--pink); font-weight:700; border-bottom-color:#2a2a35}
  table.legend tr:last-child td{font-weight:600}
  .levels{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:16px; max-width:420px}
  .lvl-btn{
    background:var(--panel); color:var(--muted); border:1px solid #2a2a35;
    border-radius:10px; padding:8px 12px; font-size:.8rem; cursor:pointer;
  }
  .lvl-btn.active{background:var(--pink-dim); color:var(--pink); border-color:var(--pink)}
  .lvl-btn.locked{opacity:.35}
  .pyramid{display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:16px}
  .pyr-row{display:flex; gap:4px}
  .pyr-cell{
    width:16px; height:16px; border-radius:4px; background:#26262f;
    transition:background .25s;
  }
  .pyr-cell.filled{background:var(--gold)}
  .prompt{font-size:2rem; text-align:center; letter-spacing:2px; margin:12px 0; word-break:break-all}

  .typed{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:14px 0}
  .typed-box{
    width:26px; height:34px; border-radius:8px; background:var(--bg);
    border:1px solid #2a2a35; display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; font-weight:700; transition:border-color .15s, background .15s;
  }
  .typed-box.filled{border-color:var(--pink-dim); background:#1c1c26}
  .typed-box.cursor{border-color:var(--pink)}

  .keyboard{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:6px}
  .kb-key{
    min-width:44px; height:44px; padding:0 12px; border-radius:10px; border:1px solid #2a2a35;
    background:var(--bg); color:var(--text); font-size:1.05rem; font-weight:700; cursor:pointer;
  }
  .kb-key:active{background:var(--pink-dim)}
  .kb-key.kb-focus{outline:2px solid var(--pink); border-color:var(--pink)}
  .kb-key.kb-del{color:var(--muted); font-size:1rem}

  .feedback{text-align:center; min-height:24px; margin-top:10px; font-size:.9rem}
  .feedback.ok{color:var(--green)}
  .feedback.ko{color:var(--red)}
  .streak{text-align:center; color:var(--muted); font-size:.8rem; margin-top:4px}
  .hint{text-align:center; color:var(--muted); font-size:.7rem; margin-top:10px}
  footer{color:var(--muted); font-size:.7rem; margin-top:24px; text-align:center}

  /* Écrans larges (tablette/ordinateur) : on utilise l'espace au lieu de rester
     figé sur une colonne taille mobile. */
  @media (min-width:700px){
    body{padding:40px 24px 64px}
    h1{font-size:1.7rem}
    .sub{font-size:1rem; margin-bottom:28px}
    .panel{max-width:560px; padding:28px}
    .levels{max-width:560px}
    .lvl-btn{padding:10px 16px; font-size:.9rem}
    table.legend{font-size:1.1rem}
    table.legend td{padding:12px 4px}
    .prompt{font-size:2.6rem}
    .typed-box{width:32px; height:42px; font-size:1.3rem}
    .kb-key{min-width:52px; height:52px; padding:0 14px; font-size:1.2rem}
  }
</style>
</head>
<body>

<h1>Système Silhouette</h1>
<div class="sub">Entraînement à la mémorisation de chiffres</div>

<div class="panel">
  <div class="legend-wrap">
    <table class="legend">
      <tr><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr>
      <tr><td>D</td><td>T</td><td>Z</td><td>M</td><td>F</td><td>S</td><td>G</td><td>L</td><td>B</td><td>Q</td></tr>
    </table>
  </div>
</div>

<div class="levels" id="levels"></div>

<div class="pyramid" id="pyramid"></div>

<div class="panel">
  <div class="prompt" id="prompt">—</div>
  <div class="typed" id="typed"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="feedback" id="feedback"></div>
  <div class="streak" id="streak"></div>
  <div class="hint">Réponse validée automatiquement · ← → puis Entrée pour choisir au clavier physique</div>
</div>

<footer>Système Silhouette · fonctionne hors-ligne une fois installé</footer>

<script>
const TABLE = {0:'D',1:'T',2:'Z',3:'M',4:'F',5:'S',6:'G',7:'L',8:'B',9:'Q'};
const REVERSE = Object.fromEntries(Object.entries(TABLE).map(([d,l])=>[l,d]));

const LEVELS = [
  {id:1, name:'Chiffre → lettre', digits:1, mode:'toLetter'},
  {id:2, name:'Lettre → chiffre', digits:1, mode:'toDigit'},
  {id:3, name:'4 chiffres', digits:4, mode:'toLetter'},
  {id:4, name:'Numéro (10)', digits:10, mode:'toLetter'},
  {id:5, name:'INSEE (15)', digits:15, mode:'toLetter'},
];

let unlocked = 1;
let current = 1;
let streak = 0;
let currentAnswer = '';

// Réponse en cours de saisie (tableau de caractères) et clavier virtuel courant.
let buffer = [];
let keys = [];
let focusIndex = 0;
let locked = false; // empêche double-validation pendant l'affichage du feedback

function randomDigits(n){
  let s = '';
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}

function currentLevel(){
  return LEVELS.find(l=>l.id===current);
}

function currentKeys(){
  return currentLevel().mode === 'toLetter' ? Object.values(TABLE) : Object.keys(TABLE);
}

function renderLevels(){
  const el = document.getElementById('levels');
  el.innerHTML = '';
  LEVELS.forEach(l=>{
    const b = document.createElement('button');
    b.className = 'lvl-btn' + (l.id===current?' active':'') + (l.id>unlocked?' locked':'');
    b.textContent = l.id + '. ' + l.name;
    b.disabled = l.id > unlocked;
    b.onclick = ()=>{ current = l.id; streak = 0; newQuestion(); renderLevels(); };
    el.appendChild(b);
  });
}

function renderPyramid(){
  const el = document.getElementById('pyramid');
  el.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'pyr-row';
  for(let i=0;i<3;i++){
    const c = document.createElement('div');
    c.className = 'pyr-cell' + (i<streak?' filled':'');
    row.appendChild(c);
  }
  el.appendChild(row);
}

function renderTyped(){
  const lvl = currentLevel();
  const el = document.getElementById('typed');
  el.innerHTML = '';
  for(let i=0;i<lvl.digits;i++){
    const box = document.createElement('div');
    box.className = 'typed-box' + (i<buffer.length?' filled':'') + (i===buffer.length?' cursor':'');
    box.textContent = buffer[i] || '';
    el.appendChild(box);
  }
}

// Clavier virtuel : uniquement les réponses possibles pour ce niveau (10 lettres ou
// 10 chiffres), plus une touche effacer. Sert à la fois de clavier tactile (mobile)
// et de sélecteur navigable au clavier physique (← → puis Entrée) sur ordinateur.
function renderKeyboard(){
  const el = document.getElementById('keyboard');
  el.innerHTML = '';
  keys = currentKeys();
  keys.forEach((k,i)=>{
    const b = document.createElement('button');
    b.className = 'kb-key' + (i===focusIndex ? ' kb-focus':'');
    b.textContent = k;
    b.type = 'button';
    b.onclick = ()=> pressKey(k);
    el.appendChild(b);
  });
  const del = document.createElement('button');
  del.className = 'kb-key kb-del' + (focusIndex===keys.length ? ' kb-focus':'');
  del.type = 'button';
  del.textContent = '⌫';
  del.onclick = ()=> backspace();
  el.appendChild(del);
}

function newQuestion(){
  const lvl = currentLevel();
  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className = 'feedback';
  buffer = [];
  focusIndex = 0;
  locked = false;

  if(lvl.mode === 'toLetter'){
    const digits = randomDigits(lvl.digits);
    document.getElementById('prompt').textContent = digits;
    currentAnswer = digits.split('').map(d=>TABLE[d]).join('');
  } else {
    const letters = Object.values(TABLE);
    const letter = letters[Math.floor(Math.random()*letters.length)];
    document.getElementById('prompt').textContent = letter;
    currentAnswer = REVERSE[letter];
  }
  document.getElementById('streak').textContent = 'Série actuelle : ' + streak + '/3';
  renderPyramid();
  renderKeyboard();
  renderTyped();
}

function pressKey(k){
  if(locked) return;
  const lvl = currentLevel();
  if(buffer.length >= lvl.digits) return;
  buffer.push(k);
  renderTyped();
  if(buffer.length === lvl.digits){
    locked = true;
    setTimeout(checkAnswer, 120);
  }
}

function backspace(){
  if(locked || buffer.length===0) return;
  buffer.pop();
  renderTyped();
}

function checkAnswer(){
  const val = buffer.join('');
  const fb = document.getElementById('feedback');
  if(val === currentAnswer){
    fb.textContent = 'Correct !';
    fb.className = 'feedback ok';
    streak++;
    if(streak >= 3 && current === unlocked){
      unlocked = Math.min(unlocked+1, LEVELS.length);
    }
    if(streak >= 3) streak = 0;
    renderLevels();
    setTimeout(newQuestion, 700);
  } else {
    fb.textContent = 'Attendu : ' + currentAnswer;
    fb.className = 'feedback ko';
    streak = 0;
    renderPyramid();
    document.getElementById('streak').textContent = 'Série actuelle : 0/3';
    setTimeout(()=>{
      buffer = [];
      focusIndex = 0;
      locked = false;
      fb.textContent = '';
      fb.className = 'feedback';
      renderTyped();
      renderKeyboard();
    }, 900);
  }
}

document.addEventListener('keydown', e=>{
  if(locked) return;
  if(e.key === 'ArrowRight'){
    focusIndex = (focusIndex + 1) % (keys.length + 1);
    renderKeyboard();
    e.preventDefault();
  } else if(e.key === 'ArrowLeft'){
    focusIndex = (focusIndex - 1 + keys.length + 1) % (keys.length + 1);
    renderKeyboard();
    e.preventDefault();
  } else if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    if(focusIndex === keys.length) backspace();
    else pressKey(keys[focusIndex]);
  } else if(e.key === 'Backspace'){
    backspace();
  } else if(e.key.length === 1){
    const up = e.key.toUpperCase();
    if(keys.includes(up)) pressKey(up);
  }
});

renderLevels();
newQuestion();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
